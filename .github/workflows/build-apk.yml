name: Build UCA Mobile (Web, Android & iOS)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy-web:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet workload install wasm-tools
      - run: dotnet publish ./UCA_Mobile.Browser/UCA_Mobile.Browser.csproj -c Release -o ./gh-pages-out
      - name: Подготовка путей для GitHub Pages
        run: |
          python3 -c '
          lt, gt = chr(60), chr(62)
          p = "./gh-pages-out/wwwroot/index.html"
          s = open(p, encoding="utf-8").read()
          s = s.replace(lt + "base href=\"/\" /" + gt, lt + "base href=\"/UCA-Mobile/\" /" + gt)
          s = s.replace(lt + "base href=\"/\"" + gt, lt + "base href=\"/UCA-Mobile/\"" + gt)
          open(p, "w", encoding="utf-8").write(s)
          '
          touch ./gh-pages-out/wwwroot/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./gh-pages-out/wwwroot
      - id: deployment
        uses: actions/deploy-pages@v4

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet workload install android
      - run: dotnet publish ./UCA_Mobile.Android/UCA_Mobile.Android.csproj -c Release -f net10.0-android -p:AndroidPackageFormat=apk
      - uses: actions/upload-artifact@v4
        with:
          name: UCA_Mobile_Android_APK
          path: ./UCA_Mobile.Android/bin/Release/net10.0-android/**/*-Signed.apk
