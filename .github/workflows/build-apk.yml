name: Build UCA Mobile (Android & iOS)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet workload install android
      - run: dotnet publish ./UCA_Mobile.Android/UCA_Mobile.Android.csproj -c Release -f net10.0-android -p:AndroidPackageFormat=apk
      - uses: actions/upload-artifact@v4
        with:
          name: UCA_Mobile_Android_APK
          path: ./UCA_Mobile.Android/bin/Release/net10.0-android/**/*-Signed.apk

  build-ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet workload install ios
      - name: Разрешить сборку на Xcode 26.6
        run: |
          python3 -c '
          import glob, re
          for p in glob.glob("/Users/runner/.dotnet/packs/Microsoft.iOS.Sdk*/*/targets/Xamarin.Shared.Sdk.targets"):
              s = open(p, encoding="utf-8").read()
              s = re.sub(r"<Error(?=[^>]*This version of \.NET for iOS)", "<Warning", s)
              open(p, "w", encoding="utf-8").write(s)
          '
      - run: dotnet build ./UCA_Mobile.iOS/UCA_Mobile.iOS.csproj -c Release -f net10.0-ios -r ios-arm64
      - name: Упаковка IPA
        run: |
          mkdir -p Payload
          find ./UCA_Mobile.iOS/bin -maxdepth 6 -name "*.app" -exec cp -r {} Payload/ \;
          zip -r UCA_Mobile.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: UCA_Mobile_iOS_IPA
          path: ./UCA_Mobile.ipa
